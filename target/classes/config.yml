# config.yml
# Настройки Border Shrink

border:
  # Минимальный размер зоны (финальный)
  min_size: 50.0

  # Максимальный размер зоны (начальный)
  max_size: 1000.0

  # Длительность игры в секундах (3600 = 1 час)
  game_duration_seconds: 3600

  # За сколько секунд до конца начнёт двигаться зона (300 = 5 минут)
  start_delay_seconds: 300

  # За сколько секунд до конца включатся смерти (-1 = выключено)
  deaths_at_seconds: 600

  # Сколько секунд от начала игры PvP выключен (0 = сразу включён)
  no_damage_seconds: 60

# Пассивки классов
passives:
  archer:
    # Увеличение урона луком (1.15 = +15%)
    bow_increase: 1.15
    # Уменьшение входящего урона в ближнем бою (0.90 = -10%)
    near_pvp_decrease: 0.90

  swordsman:
    # Увеличение урона мечом (1.10 = +10%)
    sword_increase: 1.10
    # Уменьшение входящего урона в ближнем бою (0.90 = -10%)
    melee_damage_decrease: 0.90

  tank:
    # Дополнительное HP (10.0 = +5 сердечек)
    hp_increase: 10.0
    # Уровень медлительности (3 = Slowness III)
    slowness: 3

  farmer:
    # Прочность инструментов (1.50 = +50% медленнее ломаются)
    tools_strongness: 1.50
    # Удача на руды (1.15 = +15% шанс)
    fortune_ores: 1.15
    # Уменьшение PvP урона (0.90 = -10%)
    pvp_decrease: 0.90

  alchemist:
    # Увеличение длительности зелий (1.30 = +30%)
    potion_timeplus: 1.30
    # Уменьшение PvP урона (0.80 = -20%)
    pvp_decrease: 0.80